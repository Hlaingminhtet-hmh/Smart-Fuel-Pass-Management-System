<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Fuel Pass — Admin Login</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f3f6f5;
      color: #17302f;
    }
    .card {
      width: min(420px, calc(100% - 32px));
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
    }
    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #0b7a75;
      color: #fff;
      font-size: 30px;
    }
    h1 { margin: 0; text-align: center; font-size: 28px; }
    p.sub { text-align: center; color: #687675; margin: 8px 0 28px; }
    label { display:block; margin: 14px 0 7px; font-weight: 700; }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5dfdd;
      border-radius: 12px;
      font-size: 15px;
    }
    input:focus { outline: 2px solid rgba(11,122,117,.18); border-color:#0b7a75; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #0b7a75;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .error {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fff0f0;
      color: #a12626;
      font-weight: 600;
    }
    .footer { margin-top: 18px; text-align:center; color:#7a8785; font-size:12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">⛽</div>
    <h1>Admin Portal</h1>
    <p class="sub">Smart Fuel Pass Administration</p>

    <form method="post" action="{{ url_for('rmi_login') }}">
      <label for="national_id">Admin National ID</label>
      <input id="national_id" name="national_id" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>

      <button type="submit">Sign In</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <div class="footer">Authorized administrators only</div>
  </main>
</body>
</html>
