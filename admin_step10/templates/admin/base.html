<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Fuel Pass — Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">⛽</div>Smart Fuel Pass
      </div>
      <nav class="nav">
        <a href="{{ url_for('admin_api.admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_api.admin_vehicles') }}">Vehicle Registry</a>
        <a href="{{ url_for('admin_api.admin_owners') }}">Vehicle Owners</a>
        <a href="{{ url_for('admin_api.admin_stations') }}">Fuel Stations</a>
        <a href="{{ url_for('admin_api.admin_operators') }}">Station Operators</a>
        <a href="{{ url_for('admin_api.admin_prices') }}">Fuel Prices</a>
        <a href="{{ url_for('admin_api.admin_quota_policies') }}">Fuel Quotas</a>
        <a href="{{ url_for('admin_api.admin_transactions') }}">Transactions</a>
        <a href="{{ url_for('admin_api.admin_reports') }}">Reports & Analytics</a>
        <a href="{{ url_for('admin_api.admin_settings') }}">System Settings</a>
      </nav>
      <div style="position: absolute; bottom: 18px; left: 16px; right: 16px;">
        <a href="{{ url_for('rmi_logout') }}" class="nav logout">Logout</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <form action="{{ url_for('admin_api.admin_vehicles') }}" method="get">
          <input class="search" name="search" placeholder="Search vehicles, stations, or owners..." value="{{ request.args.get('search', '') }}">
        </form>
        <div class="user">
          <div>
            <strong>{{ admin_name|default('Admin User') }}</strong>
            <div class="muted" style="font-size: 12px">Super Administrator</div>
          </div>
          <div class="avatar">A</div>
        </div>
      </header>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
